<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <meta
      name="description"
      content="Generate random color palettes in hexadecimal colors and rgb colors"
    />
    <meta name="keywords" content="Random hexadecimal colors | RGB colors" />

    <main class="main">
      <div class="container">
        <section class="main__sec-colors">
          <h1 class="sec-colors__heading">color palette generator</h1>
          <button
            id="generate-random-btn"
            class="sec-colors__button--primary button"
            type="button"
            aria-label="Generate random palette colors"
          >
            <span class="button__text">generate palette</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="button__refresh-icon icon"
              aria-hidden="true"
              focusable="false"
              role="img"
            >
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
              <path d="M16 16h5v5" />
            </svg>
          </button>

              <div class="palette__header"></div>

                  class="button__copy-icon icon"

                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"

                  <path
                    d="M15 2h-4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"
                  />
                  <path
                    d="M16.706 2.706A2.4 2.4 0 0 0 15 2v5a1 1 0 0 0 1 1h5a2.4 2.4 0 0 0-.706-1.706z"
                  />
                  <path
                    d="M5 7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 1.732-1"
                  />
                </svg>
              </button>
            </div>
